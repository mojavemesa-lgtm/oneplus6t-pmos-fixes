# LOCAL FIX 2026-09-26: at boot iio-sensor-proxy (~20 s) can start before the
# SLPI sensor registry finishes loading (~23 s via hexagonrpcd) and then reports
# "No accelerometer" until restarted, so auto-rotate is dead. Wait until 35 s of
# uptime; no delay on later restarts. Revert: delete this file + daemon-reload.
[Unit]
After=hexagonrpcd-sdsp.service
[Service]
ExecStartPre=/bin/sh -c 'while [ "$(cut -d. -f1 /proc/uptime)" -lt 35 ]; do sleep 1; done'
